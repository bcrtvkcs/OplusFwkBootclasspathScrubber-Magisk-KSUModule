name: Build Zygisk module

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          link-to-sdk: true

      - name: Build native library
        working-directory: jni
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: "${ANDROID_NDK_HOME}/ndk-build"

      - name: Stage flashable module files
        run: |
          set -e
          SO_PATH=$(find . -name 'liboplusfwk_scrubber.so' -print -quit)
          if [ -z "$SO_PATH" ]; then
            echo "ERROR: liboplusfwk_scrubber.so not found after ndk-build. Full tree:"
            find . -not -path './.git/*'
            exit 1
          fi
          echo "Found built library at: $SO_PATH"
          mkdir -p module/zygisk
          cp module.prop customize.sh uninstall.sh README.md module/
          cp "$SO_PATH" module/zygisk/arm64-v8a.so

      # actions/upload-artifact always wraps whatever it's given in one
      # more zip layer on download, so uploading an already-zipped file
      # here would produce a zip-of-a-zip that Magisk/KernelSU can't
      # flash directly (no module.prop at the top level). Uploading the
      # raw files with a trailing /* instead means that one wrapping
      # layer IS the flashable zip: downloading the "OplusFwkBootclasspathScrubber"
      # artifact from the Actions UI gives OplusFwkBootclasspathScrubber.zip
      # with module.prop etc. right at its root.
      - name: Upload flashable module (direct-flash artifact)
        uses: actions/upload-artifact@v4
        with:
          name: OplusFwkBootclasspathScrubber
          path: module/*

      - name: Upload raw .so
        uses: actions/upload-artifact@v4
        with:
          name: arm64-v8a.so
          path: module/zygisk/arm64-v8a.so

      # actions/upload-artifact downloads redirect through Azure Blob
      # Storage, which isn't reachable from the environment that needs
      # this build output - so also publish it the plain-git way: commit
      # a single-layer zip (built from the same module/ staging dir, so
      # it matches the Actions artifact exactly) straight into the repo.
      # [skip ci] keeps this push from re-triggering the build and looping.
      - name: Publish build output via git
        run: |
          set -e
          (cd module && zip -r ../dist_OplusFwkBootclasspathScrubber.zip .)
          mkdir -p dist
          mv dist_OplusFwkBootclasspathScrubber.zip dist/OplusFwkBootclasspathScrubber.zip
          cp module/zygisk/arm64-v8a.so dist/
          # Same content, named to match the GitHub Release asset this
          # project publishes under (see update.json's zipUrl) - makes
          # each new release just "download this, upload as the asset,
          # tag it".
          cp dist/OplusFwkBootclasspathScrubber.zip \
            dist/OplusFwkBootclasspathScrubber-Magisk-KSUModule-main.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist
          if git diff --cached --quiet; then
            echo "Nothing new to publish."
          else
            git commit -m "ci: publish build output for ${{ github.sha }} [skip ci]"
            git push
          fi
