name: Build Zygisk module

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          link-to-sdk: true

      - name: Build native library
        working-directory: jni
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: "${ANDROID_NDK_HOME}/ndk-build"

      - name: Assemble flashable module zip
        run: |
          set -e
          mkdir -p zygisk
          SO_PATH=$(find . -name 'liboplusfwk_scrubber.so' -print -quit)
          if [ -z "$SO_PATH" ]; then
            echo "ERROR: liboplusfwk_scrubber.so not found after ndk-build. Full tree:"
            find . -not -path './.git/*'
            exit 1
          fi
          echo "Found built library at: $SO_PATH"
          cp "$SO_PATH" zygisk/arm64-v8a.so
          zip -r OplusFwkBootclasspathScrubber.zip \
            module.prop customize.sh uninstall.sh README.md zygisk jni \
            -x "jni/obj/*" "jni/libs/*" "obj/*" "libs/*"

      - name: Upload flashable module zip
        uses: actions/upload-artifact@v4
        with:
          name: OplusFwkBootclasspathScrubber-flashable-zip
          path: OplusFwkBootclasspathScrubber.zip

      - name: Upload raw .so
        uses: actions/upload-artifact@v4
        with:
          name: arm64-v8a.so
          path: zygisk/arm64-v8a.so

      # actions/upload-artifact downloads redirect through Azure Blob
      # Storage, which isn't reachable from the environment that needs
      # this build output - so also publish it the plain-git way: commit
      # the built files straight into the repo. [skip ci] keeps this
      # push from re-triggering the build and looping.
      - name: Publish build output via git
        run: |
          set -e
          mkdir -p dist
          cp OplusFwkBootclasspathScrubber.zip dist/
          cp zygisk/arm64-v8a.so dist/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist
          if git diff --cached --quiet; then
            echo "Nothing new to publish."
          else
            git commit -m "ci: publish build output for ${{ github.sha }} [skip ci]"
            git push
          fi
