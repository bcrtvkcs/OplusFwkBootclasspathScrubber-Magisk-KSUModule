name: Build Zygisk module

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          link-to-sdk: true

      - name: Build native library
        working-directory: jni
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: "${ANDROID_NDK_HOME}/ndk-build"

      - name: Assemble flashable module zip
        run: |
          set -e
          mkdir -p zygisk
          cp jni/libs/arm64-v8a/liboplusfwk_scrubber.so zygisk/arm64-v8a.so
          zip -r OplusFwkBootclasspathScrubber.zip \
            module.prop customize.sh uninstall.sh README.md zygisk jni \
            -x "jni/obj/*" "jni/libs/*"

      - name: Upload flashable module zip
        uses: actions/upload-artifact@v4
        with:
          name: OplusFwkBootclasspathScrubber-flashable-zip
          path: OplusFwkBootclasspathScrubber.zip

      - name: Upload raw .so
        uses: actions/upload-artifact@v4
        with:
          name: arm64-v8a.so
          path: zygisk/arm64-v8a.so
